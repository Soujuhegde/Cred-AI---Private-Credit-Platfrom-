[tool.poetry]
name = "private-credit-a2a"
version = "1.0.0"
description = "Federated Multi-Agent Private Credit System"

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.115"
uvicorn = {extras = ["standard"], version = "^0.30"}
langchain = "^0.3"
langgraph = "^0.2"
openai = "^1.40"
chromadb = "^0.5"
sqlalchemy = "^2.0"
httpx = "^0.27"
pydantic = "^2.8"
python-dotenv = "^1.0"

[tool.poetry.dev-dependencies]
pytest = "^8.0"
pytest-asyncio = "^0.23"
ruff = "^0.6"
mypy = "^1.11"

[tool.ruff]
line-length = 100
select = ["E", "F", "I"]

[tool.pytest.ini_options]
markers = ["integration: requires live agent stack"]
asyncio_mode = "auto"